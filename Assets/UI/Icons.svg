    <symbol id="project-storage" viewBox="0 0 24 24"><title>Project storage</title><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 2 4 3 8 3s8-1 8-3V5"/><path d="M4 11v6c0 2 4 3 8 3s8-1 8-3v-6"/></symbol>
    <symbol id="visible" viewBox="0 0 24 24"><title>Layer visible</title><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12"/><circle cx="12" cy="12" r="3"/></symbol>
