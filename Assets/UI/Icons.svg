    <symbol id="import-ink" viewBox="0 0 24 24"><title>Import Inkarnate backup</title><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 19h16"/></symbol>
    <symbol id="save-project" viewBox="0 0 24 24"><title>Save project</title><path d="M4 3h13l3 3v15H4z"/><path d="M7 3v6h9V3"/><path d="M8 15h8v6H8z"/></symbol>
    <symbol id="undo" viewBox="0 0 24 24"><title>Undo</title><path d="m9 7-5 5 5 5"/><path d="M5 12h8a6 6 0 0 1 6 6"/></symbol>
    <symbol id="redo" viewBox="0 0 24 24"><title>Redo</title><path d="m15 7 5 5-5 5"/><path d="M19 12h-8a6 6 0 0 0-6 6"/></symbol>
    <symbol id="export-png" viewBox="0 0 24 24"><title>Export PNG</title><path d="M12 21V9"/><path d="m7 14 5-5 5 5"/><path d="M4 5h16"/></symbol>
    <symbol id="pan" viewBox="0 0 24 24"><title>Pan</title><path d="M8 11V6a2 2 0 0 1 4 0v4"/><path d="M12 9V5a2 2 0 0 1 4 0v6"/><path d="M16 9a2 2 0 0 1 4 0v5c0 5-3 7-8 7-3 0-5-2-7-5l-2-3a2 2 0 0 1 3-2l2 2"/></symbol>
    <symbol id="texture-brush" viewBox="0 0 24 24"><title>Texture Brush</title><path d="m14 4 6 6-9 9H5v-6z"/><path d="m12 6 6 6"/><path d="M5 19c-2 0-2 2-2 2h8"/></symbol>
    <symbol id="land" viewBox="0 0 24 24"><title>Land</title><path d="M3 18 8 8l4 5 3-7 6 12z"/><path d="M3 18h18"/></symbol>
    <symbol id="river" viewBox="0 0 24 24"><title>River</title><path d="M7 3c7 4-4 8 3 12s2 6 2 6"/><path d="M13 3c5 5-3 8 2 12 2 2 2 4 1 6"/></symbol>
